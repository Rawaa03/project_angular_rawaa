@if (project) {
  <section class="mt-4">
    <h3 class="text-lg font-semibold text-pink-600 mb-3">Board Kanban</h3>

    <div class="grid gap-3 md:grid-cols-3">
      @for (column of columns; track column) {
        <div class="border border-pink-100 rounded p-3 bg-pink-50/60">
          <h4 class="font-semibold text-pink-700 mb-3">{{ column }}</h4>

          <div class="space-y-3">
            @for (task of getTasks(column); track task.id) {
              <a class="block card"
                 [routerLink]="['/projects', project.id, 'tasks', task.id]">
                <span class="font-semibold">{{ task.title }}</span>
                <span class="block text-sm text-gray-500">{{ task.priority }}</span>
              </a>
            } @empty {
              <p class="text-sm text-gray-400">Aucune tache</p>
            }
          </div>
        </div>
      }
    </div>
  </section>
}
