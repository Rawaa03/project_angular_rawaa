<div class="mt-4">
  <div class="mb-4 grid gap-3 md:grid-cols-2">
    <select [(ngModel)]="sort"
            (ngModelChange)="updateQueryParams()"
            class="border p-2 rounded w-full">
      <option value="">Tri par defaut</option>
      <option value="priority">Tri par priorite</option>
    </select>

    <select [(ngModel)]="status"
            (ngModelChange)="updateQueryParams()"
            class="border p-2 rounded w-full">
      <option value="">Tous les statuts</option>
      <option value="En attente">En attente</option>
      <option value="En cours">En cours</option>
      <option value="Termine">Termine</option>
    </select>
  </div>

  @if (getFilteredTasks().length === 0) {
    <p class="text-pink-400 italic mt-4">
      Aucune tache
    </p>
  } @else {

    <div class="mt-4 space-y-3">

      @for (task of getFilteredTasks(); track task.id) {

        <div class="card border-l-4"
             [ngClass]="getStatusClass(task.status)">

          <p class="font-semibold"
             [ngClass]="task.priority | priorityColor">
            {{ task.title }}
          </p>

          <p class="text-sm text-gray-400">
            {{ task.priority }} - {{ task.status }}
          </p>

          <div class="mt-2 flex flex-wrap gap-2">
            <button class="btn"
                    [routerLink]="['/projects', projectId, 'tasks', task.id]">
              Voir tache
            </button>

            <button class="btn"
                    [routerLink]="['/projects', projectId, 'tasks', task.id, 'edit']">
              Editer
            </button>

            <button class="btn"
                    (click)="changeStatus(task)">
              Changer statut
            </button>
          </div>

        </div>

      }

    </div>
  }
</div>
