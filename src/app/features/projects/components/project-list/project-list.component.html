@if (message) {
  <div class="toast">
    {{ message }}
  </div>
}

<div class="p-6">

  <h1 class="text-2xl font-bold text-pink-500 mb-4">
    Liste des projets
  </h1>

  <div class="card mb-4">

    <input [(ngModel)]="newProjectName"
           placeholder="Nom du projet"
           class="border p-2 rounded w-full mb-2" />

    <input [(ngModel)]="newProjectDesc"
           placeholder="Description"
           class="border p-2 rounded w-full mb-2" />

    <button class="btn" (click)="addProject()">
      Ajouter projet
    </button>

  </div>

  <app-dashboard [projects]="projects"></app-dashboard>

  @for (project of projects; track project.id) {

    <div class="card mb-3">

      <div class="flex flex-wrap justify-between items-center gap-2">

        <div class="flex-1 min-w-60">

          <h2 class="text-lg font-semibold text-pink-600">
            {{ project.name }}
          </h2>

          <p class="text-sm text-gray-400">
            {{ project.description }}
          </p>

        </div>

        <button class="btn whitespace-nowrap"
                [routerLink]="['/projects', project.id]">
          Voir details
        </button>

        <button class="btn bg-red-400"
                (click)="deleteProject(project)">
          Supprimer
        </button>

      </div>

    </div>
  }

</div>
